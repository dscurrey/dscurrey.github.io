<section class="row" id="experience">
    <h2 class="label-col label"><span class="num">00</span> / Experience</h2>
    <div class="content">
        {% for job in site.data.experience %}
        <article class="entry">
            <div class="when">{{ job.when }}</div>
            <div>
                <h3>{{ job.title }}</h3>
                {% for para in job.details %}{{ para | markdownify }}{% endfor %}
            </div>
        </article>
        {% endfor %}
    </div>
</section>
