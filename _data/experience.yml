- when: Ongoing
  title: Self-Hosting
  details:
    - Self-hosted services, deployed with GitOps (Docker Compose via Portainer). Not this site, which is on GitHub Pages.
    - Runs [Gitea](https://gitea.dcurrey.co.uk/) (Git), [Audiobookshelf](https://github.com/advplyr/audiobookshelf) (audiobooks) and [Immich](https://github.com/immich-app/immich) (photos).
    - Personal DevOps environment running Jenkins and SonarQube against my own repositories. Experimenting here has helped identify CI/CD changes that could boost efficiency at work.
    - Evaluating log aggregation (Seq vs Grafana/Loki) for professional use.
    - Public access via Cloudflare and a reverse proxy with automatic SSL.
    - Private services are reached over a Headscale VPN. Headscale is a self-hosted version of Tailscale, which links devices directly (peer-to-peer) into a private network without exposing them to the internet.

