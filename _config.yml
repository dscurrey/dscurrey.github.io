# Site settings
name: Dylan Currey
email: dscurrey@outlook.com
canonical_url: https://dscurrey.co.uk
keywords: "developer, software developer, C#, .NET, T-SQL, Docker, Linux, self-hosting, Middlesbrough"
skills: "Developer" #"BSc Computer Science Student (Hons) (First Class) Graduate"
baseurl:

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
# You should replace these with your social networks, of course. :)
social:
  - title: linkedin
    url: https://www.linkedin.com/in/dscurrey/
  - title: github
    url: https://github.com/dscurrey
  - title: gitea
    url: https://gitea.dcurrey.co.uk/
  # - title: self-hosting-dash
  #   url: https://dash.dcurrey.co.uk/
  # - title: wordpress
  #   url: https://wp.dcurrey.co.uk/

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Theme settings (hex-codes WITH the leading hash-tag)
# accent: used for links, hover states and section numbers.
# Light/dark values are separate so contrast stays readable in both themes.
color:
  accent: "#c8381a"
  accent_dark: "#ff7a50"

# Hero layout: "compact" (small name + key/value details) or "large" (big name)
hero_style: compact

# One-line summary shown under the name (leave empty to hide)
summary: "Software developer. C# / .NET / T-SQL. Legacy modernisation, self-hosting."

# Short status line with an accent dot (leave empty to hide).
# Placeholder: planned final wording is "Experimenting with AI" (apply at the end of the redesign).
status: "Rebuilding this site"

# Show the email address in the hero (uses `email` above). Hidden by default.
show_email: false

# Key/value rows shown in the compact hero, in order. Contact, Links and Status
# rows are added automatically after these when enabled/set.
hero_details:
  - label: Role
    value: Developer
  - label: Employer
    value: razorblue
  - label: Location
    value: Middlesbrough, GB
    flag: gb   # optional: shows a flag before the value (supported: gb)

# Page content lives in _data/:
#   _data/about.yml       About paragraphs
#   _data/experience.yml  Experience entries
#   _data/skills.yml      Skills list

# Build settings
markdown: kramdown
permalink: pretty

# Files kept in the repo but not published
exclude:
  - DESIGN_NOTES.md
